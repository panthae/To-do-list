<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>My Tasks</h1>
            <p>Stay organized and productive</p>
        </div>

        <div class="task">
            <form class="task-form" id="task-form">
                <input type="text" id="task-input" placeholder="What need to be done" required>
                <button type="submit" id="submit">Add Task</button>
            </form>
        </div>

        <div class="section">
            <ul class="list" id="task-list">
                <li class="item">
                    <input type="checkbox" class="checkbox">
                    <span class="name">Study Javascript</span>
                    <button type="button" class="delete">Delete</button>
                </li>

                <li class="item">
                    <input type="checkbox" class="checkbox">
                    <span class="name">Read a book</span>
                    <button type="button" class="delete">Delete</button>
                </li>

                <li class="item">
                    <input type="checkbox" class="checkbox">
                    <span class="name">Pratice English</span>
                    <button type="button" class="delete">Delete</button>
                </li>
            </ul>
        </div>

        <div class="footer">
            <p id="total-tasks">3 tasks</p>
            <p id="complete-tasks">0 complete</p>
        </div>
    </div>
    
</body>
</html>
